# Hirzexa Production Deployment
# Docker Compose with nginx HTTPS termination

version: "3.8"

services:
  # ===========================================
  # nginx Reverse Proxy (HTTPS termination)
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: hirzexa-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - hirzexa
      - frontend
    restart: unless-stopped
    networks:
      - hirzexa-network
    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # Hirzexa Backend (API + Processing)
  # ===========================================
  hirzexa:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: hirzexa-backend
    environment:
      - HIRZEXA_API_HOST=0.0.0.0
      - HIRZEXA_API_PORT=8080
      - HIRZEXA_API_KEY=${HIRZEXA_API_KEY:?HIRZEXA_API_KEY must be set}
      - HIRZEXA_DEBUG=false
      - DATABASE_URL=sqlite:////app/data/hirzexa.db
    volumes:
      - hirzexa-data:/app/data
      - hirzexa-models:/app/models
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - hirzexa-network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: hirzexa-frontend
    environment:
      - NODE_ENV=production
      - HIRZEXA_API_URL=http://hirzexa:8080
      - HIRZEXA_API_KEY=${HIRZEXA_API_KEY:?HIRZEXA_API_KEY must be set}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - hirzexa-network
    depends_on:
      - hirzexa
  # ===========================================
  # PostgreSQL (optional - for production scale)
  # ===========================================
